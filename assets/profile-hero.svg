<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Vikash Kumar — Developer</title>
  <desc id="desc">Animated developer profile header with a dark futuristic interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#15103a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="27" fill="url(#grid)" stroke="#334155" stroke-opacity=".45"/>

  <circle cx="980" cy="50" r="105" fill="#6366f1" opacity=".18" filter="url(#blur)">
    <animate attributeName="cx" values="980;1080;980" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;110;50" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="285" r="85" fill="#06b6d4" opacity=".13" filter="url(#blur)">
    <animate attributeName="cx" values="170;90;170" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".9">
    <rect x="64" y="50" width="8" height="8" rx="2" fill="#22d3ee">
      <animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="86" y="57" font-family="monospace" font-size="14" fill="#94a3b8">~/VIKASH222 · profile.exe</text>
  </g>

  <text x="64" y="128" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">VIKASH KUMAR</text>
  <rect x="66" y="148" width="430" height="3" rx="2" fill="url(#glow)">
    <animate attributeName="width" values="120;430;240;430" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="64" y="191" font-family="monospace" font-size="20" fill="#cbd5e1">B.Tech CSE • Software Builder • AI Explorer</text>

  <g font-family="monospace" font-size="15">
    <rect x="64" y="222" width="238" height="42" rx="10" fill="#0f172a" stroke="#334155"/>
    <circle cx="84" cy="243" r="5" fill="#22c55e"/>
    <text x="100" y="248" fill="#94a3b8">status</text><text x="162" y="248" fill="#e2e8f0">building</text>

    <rect x="316" y="222" width="235" height="42" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="336" y="248" fill="#94a3b8">focus</text><text x="390" y="248" fill="#e2e8f0">full-stack + AI</text>
  </g>

  <g transform="translate(800 92)">
    <rect x="0" y="0" width="318" height="160" rx="18" fill="#060b16" stroke="#334155"/>
    <circle cx="22" cy="22" r="5" fill="#ef4444"/>
    <circle cx="40" cy="22" r="5" fill="#eab308"/>
    <circle cx="58" cy="22" r="5" fill="#22c55e"/>
    <text x="20" y="55" font-family="monospace" font-size="13" fill="#64748b">developer@vikash:~$</text>
    <text x="20" y="82" font-family="monospace" font-size="14" fill="#a78bfa">whoami</text>
    <text x="20" y="105" font-family="monospace" font-size="14" fill="#e2e8f0">builder_of_real_apps</text>
    <text x="20" y="132" font-family="monospace" font-size="14" fill="#67e8f9">ship()</text>
    <rect x="20" y="143" width="9" height="16" fill="#e2e8f0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="64" y="301" font-family="monospace" font-size="13" fill="#64748b">BUILD → TEST → IMPROVE → SHIP</text>
</svg>