<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080b14"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#17112f"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/>
  </pattern>
</defs>

<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="358" rx="25" fill="url(#grid)" stroke="#334155" stroke-opacity=".55"/>

<circle cx="1060" cy="90" r="120" fill="#6366f1" opacity=".12" filter="url(#blur)">
  <animate attributeName="cx" values="1060;1110;1060" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="90;130;90" dur="8s" repeatCount="indefinite"/>
</circle>
<circle cx="360" cy="320" r="90" fill="#06b6d4" opacity=".08" filter="url(#blur)">
  <animate attributeName="cx" values="360;280;360" dur="7s" repeatCount="indefinite"/>
</circle>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <rect x="58" y="48" width="235" height="28" rx="14" fill="#0b1220" stroke="#1e293b"/>
  <circle cx="76" cy="62" r="5" fill="#22c55e">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="90" y="67" font-size="12" fill="#94a3b8">VIKASH222 / DEVELOPER</text>

  <text x="58" y="135" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" fill="#f8fafc">VIKASH KUMAR</text>
  <rect x="60" y="156" width="430" height="3" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="110;430;260;430" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="197" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#cbd5e1">Computer Science • Software Engineering • AI</text>

  <text x="60" y="246" font-size="14" fill="#64748b">BUILDING:</text>
  <text x="138" y="246" font-size="14" fill="#e2e8f0">real-world products, not just demos.</text>

  <rect x="58" y="276" width="460" height="42" rx="12" fill="#0a0f1c" stroke="#263244"/>
  <text x="78" y="302" font-size="14" fill="#22d3ee">idea</text>
  <text x="120" y="302" font-size="14" fill="#64748b">→</text>
  <text x="144" y="302" font-size="14" fill="#818cf8">design</text>
  <text x="198" y="302" font-size="14" fill="#64748b">→</text>
  <text x="222" y="302" font-size="14" fill="#a78bfa">code</text>
  <text x="266" y="302" font-size="14" fill="#64748b">→</text>
  <text x="290" y="302" font-size="14" fill="#c084fc">test</text>
  <text x="332" y="302" font-size="14" fill="#64748b">→</text>
  <text x="356" y="302" font-size="14" fill="#f0abfc">ship</text>
</g>

<g transform="translate(720 58)">
  <rect width="420" height="245" rx="20" fill="#070b13" fill-opacity=".82" stroke="#334155"/>
  <rect x="0" y="0" width="420" height="42" rx="20" fill="#0f172a"/>
  <circle cx="24" cy="21" r="5" fill="#fb7185"/><circle cx="42" cy="21" r="5" fill="#fbbf24"/><circle cx="60" cy="21" r="5" fill="#4ade80"/>
  <text x="82" y="25" font-family="monospace" font-size="12" fill="#64748b">~/Vikash222</text>

  <g font-family="monospace" font-size="14">
    <text x="26" y="72" fill="#64748b">const</text><text x="78" y="72" fill="#f8fafc">vikash</text><text x="132" y="72" fill="#64748b">= {</text>
    <text x="46" y="98" fill="#818cf8">role:</text><text x="112" y="98" fill="#c4b5fd">"software builder"</text>,
    <text x="46" y="124" fill="#818cf8">focus:</text><text x="120" y="124" fill="#67e8f9">["web","AI","systems"]</text>,
    <text x="46" y="150" fill="#818cf8">status:</text><text x="120" y="150" fill="#86efac">"shipping"</text>,
    <text x="46" y="176" fill="#818cf8">mindset:</text><text x="134" y="176" fill="#fde68a">"learn by building"</text>
    <text x="26" y="204" fill="#64748b">};</text>
  </g>

  <rect x="26" y="216" width="10" height="14" fill="#e2e8f0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</g>

<text x="60" y="342" font-family="monospace" font-size="11" fill="#475569">ENGINEERING · CURIOSITY · CONSISTENCY</text>
</svg>