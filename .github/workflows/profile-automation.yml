name: Profile Automation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/scripts/update-profile.mjs"
      - ".github/workflows/profile-automation.yml"
      - "assets/profile-hero.svg"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-automation
  cancel-in-progress: true

jobs:
  update-profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate live profile pulse
        run: node .github/scripts/update-profile.mjs

      - name: Commit generated profile asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-pulse.svg

          if git diff --cached --quiet; then
            echo "No profile changes detected."
            exit 0
          fi

          git commit -m "chore: refresh profile pulse"
          git push
