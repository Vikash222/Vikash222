name: Automate GitHub Profile

on:
  schedule:
    - cron: "13 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-automation
  cancel-in-progress: true

jobs:
  refresh-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh live GitHub section
        run: node .github/scripts/update-profile.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi

          git commit -m "chore: refresh live GitHub profile"
          git push
